<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e0d09">
    <meta name="description" content="Ingredients and cooking instructions for Nasi Goreng.">
    <title>Nasi Goreng Recipe | Taste Like Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600&family=Merriweather:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="recipe.css">
    <script src="../app.js" defer></script>
</head>
<body id="top">
    <a class="skip-link" href="#ingredients">Skip to ingredients</a>
    <div class="site-shell recipe-shell">
        <header class="site-header">
            <a class="site-brand type-label" href="../index.html" aria-label="Taste Like Home home">
                Taste Like <span>Home</span>
            </a>
            <a class="header-link type-label" href="../index.html#recipes">Back to the collection <span aria-hidden="true">↗</span></a>
        </header>

        <main id="main-content" class="recipe-main">
            <section class="recipe-head" aria-labelledby="recipe-title">
                <div class="recipe-title-group">
                    <h1 class="recipe-title type-display" id="recipe-title">Nasi Goreng</h1>
                    <p class="recipe-countline type-body"><strong>8 ingredients</strong><span aria-hidden="true">·</span><strong>6 instructions</strong></p>
                </div>
                <nav class="section-nav type-label" aria-label="Jump to recipe section">
                    <a href="#ingredients">Ingredients</a>
                    <a href="#instructions">Instructions</a>
                </nav>
            </section>

            <section class="progress-rail" aria-label="Checklist progress controls">
                <div class="progress-unit">
                    <div class="progress-topline">
                        <span class="progress-label">Ingredients</span>
                        <span class="progress-count" id="ingredients-count" aria-live="polite">0 of 8 complete</span>
                    </div>
                    <progress class="progress-bar" id="ingredients-progress" data-list-name="ingredients" aria-label="0 of 8 ingredients checked" max="8" value="0">0 of 8</progress>
                </div>
                <div class="progress-unit">
                    <div class="progress-topline">
                        <span class="progress-label">Instructions</span>
                        <span class="progress-count" id="instructions-count" aria-live="polite">0 of 6 complete</span>
                    </div>
                    <progress class="progress-bar" id="instructions-progress" data-list-name="instructions" aria-label="0 of 6 instructions checked" max="6" value="0">0 of 6</progress>
                </div>
                <div class="clear-utility">
                    <p class="clear-explainer type-small">Clears both lists.</p>
                    <button class="clear-progress type-label" id="clear-progress" type="button">Clear progress</button>
                </div>
            </section>

            <div class="recipe-spread">
                <section class="ingredient-panel" id="ingredients" aria-labelledby="ingredients-title">
                    <div class="section-heading">
                        <h2 class="type-heading" id="ingredients-title">Ingredients</h2>
                        <span class="list-meta type-label">8 items</span>
                    </div>
                    <ul class="ingredient-list">
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>300 g cold, cooked rice</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>2 eggs, beaten</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>15 ml vegetable oil</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>2 cloves garlic, minced</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>1 shallot, minced</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>15 ml sambal oelek (adjust to taste)</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>30 ml kecap manis</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>Salt and pepper to taste</span></label></li>
                    </ul>
                </section>

                <section class="instruction-panel" id="instructions" aria-labelledby="instructions-title">
                    <div class="section-heading section-heading--dark">
                        <h2 class="type-heading" id="instructions-title">Instructions</h2>
                        <span class="list-meta type-label">6 steps</span>
                    </div>
                    <ol class="instruction-list">
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Heat the oil in a wok or large pan over medium-high heat.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Add the beaten eggs and scramble until just set, then transfer to a plate.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Add the garlic and shallot to the pan and stir-fry until fragrant.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Stir in the sambal, then add the cold rice and break up any clumps.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Return the eggs to the pan and add the kecap manis, salt, and pepper.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Stir-fry until everything is hot and evenly coated, then serve.</span></label></li>
                    </ol>
                </section>
            </div>
        </main>

        <footer class="site-footer recipe-footer">
            <p class="footer-brand type-label">Taste Like Home</p>
            <a class="back-to-top type-small" href="#top">Back to top <span aria-hidden="true">↑</span></a>
        </footer>
    </div>
</body>
</html>
