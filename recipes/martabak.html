    <div class="site-shell recipe-shell">
        <header class="site-header">
            <a class="site-brand type-label" href="../index.html" aria-label="Taste Like Home home">
                Taste Like <span>Home</span>
            </a>
            <a class="header-link type-label" href="../index.html#recipes">Back to the collection <span aria-hidden="true">↗</span></a>
        </header>

        <main id="main-content" class="recipe-main">
            <section class="recipe-head" aria-labelledby="recipe-title">
                <div class="recipe-title-group">
                    <h1 class="recipe-title type-display" id="recipe-title">Martabak</h1>
                    <p class="recipe-countline type-body"><strong>11 ingredients</strong><span aria-hidden="true">·</span><strong>9 instructions</strong></p>
                </div>
                <nav class="section-nav type-label" aria-label="Jump to recipe section">
                    <a href="#ingredients">Ingredients</a>
                    <a href="#instructions">Instructions</a>
                </nav>
            </section>

            <section class="progress-rail" aria-label="Checklist progress controls">
                <div class="progress-unit">
                    <div class="progress-topline">
                        <span class="progress-label">Ingredients</span>
                        <span class="progress-count" id="ingredients-count" aria-live="polite">0 of 11 complete</span>
                    </div>
                    <progress class="progress-bar" id="ingredients-progress" data-list-name="ingredients" aria-label="0 of 11 ingredients checked" max="11" value="0">0 of 11</progress>
                </div>
                <div class="progress-unit">
                    <div class="progress-topline">
                        <span class="progress-label">Instructions</span>
                        <span class="progress-count" id="instructions-count" aria-live="polite">0 of 9 complete</span>
                    </div>
                    <progress class="progress-bar" id="instructions-progress" data-list-name="instructions" aria-label="0 of 9 instructions checked" max="9" value="0">0 of 9</progress>
                </div>
                <div class="clear-utility">
                    <p class="clear-explainer type-small">Clears both lists.</p>
                    <button class="clear-progress type-label" id="clear-progress" type="button">Clear progress</button>
                </div>
            </section>

            <div class="recipe-spread">
                <section class="ingredient-panel" id="ingredients" aria-labelledby="ingredients-title">
                    <div class="section-heading">
                        <h2 class="type-heading" id="ingredients-title">Ingredients</h2>
                        <span class="list-meta type-label">11 items</span>
                    </div>
                    <ul class="ingredient-list">
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>250 g all-purpose flour</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>300 ml warm water</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>1 large egg</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>50 g granulated sugar</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>3 g instant yeast</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>3 g baking soda</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>2 g fine salt</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>30 g butter, softened</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>40 g chocolate sprinkles</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>40 g grated cheddar cheese</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>30 ml sweetened condensed milk</span></label></li>
                    </ul>
                </section>

                <section class="instruction-panel" id="instructions" aria-labelledby="instructions-title">
                    <div class="section-heading section-heading--dark">
                        <h2 class="type-heading" id="instructions-title">Instructions</h2>
                        <span class="list-meta type-label">9 steps</span>
                    </div>
                    <ol class="instruction-list">
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Whisk the flour, sugar, yeast, and salt together in a large bowl.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Whisk the egg into the warm water, then gradually mix it into the dry ingredients until smooth.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Beat the batter for 2-3 minutes, cover, and leave in a warm place until bubbly, about 45 minutes.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Stir the baking soda into 1 tablespoon of water and fold it into the batter.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Heat a nonstick pan over low heat and lightly grease it with a little butter.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Pour in the batter, cover the pan, and cook until the surface is full of bubbles and nearly set.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Uncover and cook briefly until the top is set and the bottom is golden.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Spread the remaining butter over the hot martabak, then add the chocolate sprinkles and cheese.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Drizzle with condensed milk, fold in half, slice, and serve warm.</span></label></li>
                    </ol>
                </section>
            </div>
        </main>
