    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e0d09">
    <meta name="description" content="Ingredients and cooking instructions for Rawon.">
    <title>Rawon Recipe | Taste Like Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600&family=Merriweather:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

</head>
<body id="top">
    <a class="skip-link" href="#ingredients">Skip to ingredients</a>
    <div class="site-shell recipe-shell">
        <header class="site-header">
            <a class="site-brand type-label" href="../index.html" aria-label="Taste Like Home home">
                Taste Like <span>Home</span>
            </a>
            <a class="header-link type-label" href="../index.html#recipes">Back to the collection <span aria-hidden="true">↗</span></a>
        </header>

        <main id="main-content" class="recipe-main">
            <section class="recipe-head" aria-labelledby="recipe-title">
                <div class="recipe-title-group">
                    <h1 class="recipe-title type-display" id="recipe-title">Rawon</h1>
                    <p class="recipe-countline type-body"><strong>11 ingredients</strong><span aria-hidden="true">·</span><strong>4 instructions</strong></p>
                </div>
                <nav class="section-nav type-label" aria-label="Jump to recipe section">
                    <a href="#ingredients">Ingredients</a>
                    <a href="#instructions">Instructions</a>
                </nav>
            </section>

            <section class="progress-rail" aria-label="Checklist progress controls">
                <div class="progress-unit">
                    <div class="progress-topline">
                        <span class="progress-label">Ingredients</span>
                        <span class="progress-count" id="ingredients-count" aria-live="polite">0 of 11 complete</span>
                    </div>
                    <progress class="progress-bar" id="ingredients-progress" data-list-name="ingredients" aria-label="0 of 11 ingredients checked" max="11" value="0">0 of 11</progress>
                </div>
                <div class="progress-unit">
                    <div class="progress-topline">
                        <span class="progress-label">Instructions</span>
                        <span class="progress-count" id="instructions-count" aria-live="polite">0 of 4 complete</span>
                    </div>
                    <progress class="progress-bar" id="instructions-progress" data-list-name="instructions" aria-label="0 of 4 instructions checked" max="4" value="0">0 of 4</progress>
                </div>
                <div class="clear-utility">
                    <p class="clear-explainer type-small">Clears both lists.</p>
                    <button class="clear-progress type-label" id="clear-progress" type="button">Clear progress</button>
                </div>
            </section>

            <div class="recipe-spread">
                <section class="ingredient-panel" id="ingredients" aria-labelledby="ingredients-title">
                    <div class="section-heading">
                        <h2 class="type-heading" id="ingredients-title">Ingredients</h2>
                        <span class="list-meta type-label">11 items</span>
                    </div>
                    <ul class="ingredient-list">
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>500 g beef brisket, cut into bite-sized pieces</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>60 g prepared keluak (pangium) paste</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>6 shallots (about 60 g), peeled</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>4 cloves garlic, peeled</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>20 g fresh galangal, sliced</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>2 stalks lemongrass, bruised</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>2 Indonesian bay leaves (daun salam)</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>2 g ground coriander</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>1.5 L beef stock or water</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>15 ml neutral cooking oil</span></label></li>
                        <li><label class="ingredient-row"><input data-group="ingredients" type="checkbox"><span>Salt to taste</span></label></li>
                    </ul>
                </section>

                <section class="instruction-panel" id="instructions" aria-labelledby="instructions-title">
                    <div class="section-heading section-heading--dark">
                        <h2 class="type-heading" id="instructions-title">Instructions</h2>
                        <span class="list-meta type-label">4 steps</span>
                    </div>
                    <ol class="instruction-list">
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Blend the keluak paste, shallots, garlic, galangal, and coriander with a splash of stock until smooth.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Heat the oil in a pot and cook the spice paste over medium heat until fragrant and darkened, about 5 minutes.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Add the beef, lemongrass, bay leaves, and remaining stock. Bring to a boil, skim any foam, then cover and simmer gently until the beef is tender, about 2-3 hours.</span></label></li>
                        <li><label class="step-row"><input data-group="instructions" type="checkbox"><span>Remove the lemongrass and bay leaves, season with salt to taste, and serve hot.</span></label></li>
                    </ol>
                </section>
            </div>
        </main>

        <footer class="site-footer recipe-footer">
            <p class="footer-brand type-label">Taste Like Home</p>
            <a class="back-to-top type-small" href="#top">Back to top <span aria-hidden="true">↑</span></a>
